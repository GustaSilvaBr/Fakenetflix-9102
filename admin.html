<html>

<head>
    <style>
        #categories{
            display: flex;
            justify-content: space-between;
            padding-left:20px;
            padding-right:20px;
        }
    </style>
</head>

<body>
    <a href="index.html"> Go to the client page </a>
    <h2>Categories</h2>
    <div id="categories">

        <div>
            <h3>Comedy</h3>
            <div>
                <label>
                    Title:
                </label>
                <input id="comedy_title">
            </div>

            <div>
                <label>
                    Photo link
                </label>
                <input id="comedy_photo">
            </div>

            <button onclick="upload_comedy()">
                upload
            </button>

            <h4 id="comedy-movie-name"></h4>
        </div>

        <div>
            <h3>Action</h3>
            <div>
                <label>
                    Title:
                </label>
                <input id="title">
            </div>

            <div>
                <label>
                    Photo link
                </label>
                <input id="link">
            </div>

            <button onclick="upload()">
                upload
            </button>
             <h4 id="action-movie-name"></h4>
        </div>

        <div>
            <h3>Horror</h3>
            <div>
                <label>
                    Title:
                </label>
                <input id="title">
            </div>

            <div>
                <label>
                    Photo link
                </label>
                <input id="link">
            </div>

            <button onclick="upload()">
                upload
            </button>

            <h4 id="horror-movie-name"></h4>
        </div>

    </div>

    <script>
        function upload_comedy() {
            var comedy_movie = {
                comedy_title: document.getElementById("comedy_title").value,
                comedy_photo: document.getElementById("comedy_photo").value
            }
            localStorage.setItem("comedy", JSON.stringify(comedy_movie));
        }
    </script>
</body>

</html>
